# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: publish artifact

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  publish-windows-artifact:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish Windows
      run: dotnet publish Needlefish.Compiler/Needlefish.Compiler.csproj -c Release -r win-x64
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nsdc_windows
        path: ${{ github.workspace }}/Needlefish.Compiler/bin/Release/net10.0/win-x64/publish/nsdc.exe

  publish-linux-artifact:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish Linux
      run: dotnet publish Needlefish.Compiler/Needlefish.Compiler.csproj -c Release -r linux-x64
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nsdc_linux
        path: ${{ github.workspace }}/Needlefish.Compiler/bin/Release/net10.0/linux-x64/publish/nsdc
